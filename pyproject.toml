[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmed-search"
version = "1.0.0"
description = "Search PubMed and generate BibTeX references from the command line. Zero dependencies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Edis D. Tireli", email = "edtireli@gmail.com"},
]
keywords = [
    "pubmed", "bibtex", "citation", "literature", "ncbi",
    "bibliography", "reference-manager", "latex", "academic",
    "doi", "crossref", "research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]

[project.scripts]
pubmed-search = "pubmed_search.cli:main"

[project.urls]
Homepage = "https://github.com/edtireli/pubmed-search"
Repository = "https://github.com/edtireli/pubmed-search"
Issues = "https://github.com/edtireli/pubmed-search/issues"
